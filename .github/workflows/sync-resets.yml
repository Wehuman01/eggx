name: Sync codex resets

on:
  schedule:
    # 每小时 :23 同步一次（GitHub 按UTC触发）。避开整点高峰——GitHub 官方文档
    # 明确说 cron 高峰期（尤其整点）会大幅延迟。上游 AIHOT 每 15 分钟核验一次、
    # 响应缓存 60 秒，每小时拉一次远低于其限流线。
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resets

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync from AIHOT
        run: npm run sync:resets

      - name: Commit and push if content changed
        run: |
          if git diff --quiet src/content/resets.ts; then
            echo "No reset updates."
            exit 0
          fi
          git config user.name "eggx-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/resets.ts
          git commit -m "sync: codex resets from AIHOT"
          # 竞态防护：检出与 push 之间若有别的推送进了 main（人工编辑或另一个
          # sync），push 会被拒。rebase 到最新 main 后重试几次。
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1
