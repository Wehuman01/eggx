name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天北京时间 09:07（UTC 01:07）空跑一次：站点是静态构建，到期条目要等
    # 下一次构建才从临时羊毛归档进 /expired。定时重建让过期翻转最迟当天上午
    # 生效，不依赖人工 push；CI 绿了会经 workflow_run 自动触发 deploy。
    # 避开整点高峰（GitHub 官方文档：整点 cron 延迟大）。
    - cron: "7 1 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run
        env:
          AWESHARE_CONSUMER_TOKEN: ${{ secrets.AWESHARE_CONSUMER_TOKEN }}